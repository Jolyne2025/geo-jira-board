<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO Jira Ticket 总表（数据看板）2026-08-26</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #fff; --ink: #1f2430; --muted: #6b7280; --line: #e5e7eb;
    --blue: #2563eb; --blue-bg: #eff6ff; --green: #16a34a; --green-bg: #f0fdf4;
    --red: #dc2626; --red-bg: #fef2f2; --amber: #d97706; --amber-bg: #fffbeb;
    --purple: #7c3aed; --purple-bg: #f5f3ff; --teal: #0d9488; --teal-bg: #f0fdfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pingfang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; padding: 28px 16px 60px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, #ede9fe, #ddd6fe); border-radius: 14px;
    padding: 24px 32px; color: #4c1d95; margin-bottom: 22px; box-shadow: 0 6px 20px rgba(124,58,237,.18);
  }
  header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #3b0764; }
  header .meta { font-size: 13px; opacity: .9; color: #6d28d9; }

  .goal-card {
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--blue); border-radius: 12px;
    margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
    padding: 14px 20px;
  }
  .goal-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .goal-header .goal-badge { font-size: 12px; background: #ede9fe; color: #6d28d9; border-radius: 6px; padding: 2px 10px; }
  .goal-header .goal-name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
  .goal-desc { font-size: 13px; color: var(--muted); margin-top: 6px; padding-left: 4px; }

  .epic-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
    overflow: hidden;
  }
  .epic-header {
    background: #f8fafc; padding: 13px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .epic-header .name { font-size: 15.5px; font-weight: 700; color: var(--purple); }
  .epic-header .epic-badge { font-size: 11px; background: #ede9fe; color: #6d28d9; border-radius: 6px; padding: 2px 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #f1f5f9; color: #475569; font-weight: 600;
    padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line);
    font-size: 12px; white-space: nowrap;
  }
  tbody td { padding: 7px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tbody tr:hover { background: #fafbfe; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .ticket-link { color: var(--blue); text-decoration: none; font-weight: 500; }
  .ticket-link:hover { text-decoration: underline; }
  .epic-link, .title-link { color: var(--blue); text-decoration: none; font-weight: 500; }
  .epic-link:hover, .title-link:hover { text-decoration: underline; }
  .en { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #6d28d9; }
  .sub { border-left: 3px solid #c4b5fd; margin-left: 8px; }

  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 16px 0; }
  .summary-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; text-align: center;
  }
  .summary-card .num { font-size: 22px; font-weight: 700; color: var(--purple); }
  .summary-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  h2.section-title {
    font-size: 17px; font-weight: 700; margin: 28px 0 14px;
    padding-left: 10px; border-left: 4px solid var(--purple);
  }
  .status-tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }
  .st-sched { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; }
  .st-closed { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
  .st-prd { background: var(--purple-bg); color: var(--purple); border: 1px solid #ddd6fe; }
  .st-triage { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; }
  .pri { display: inline-block; padding: 1px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .pri-p0 { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .pri-p1 { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; }
  .pri-p2 { background: #f3f4f6; color: #64748b; border: 1px solid #e5e7eb; }
  .foot-note { font-size: 12.5px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 16px; margin-top: 14px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  @media (max-width: 760px) { table { font-size: 12px; } td, th { padding: 5px 8px; } }
  <!-- ===== 侧边导航 ===== -->
  .toc { position: fixed; left: 16px; top: 16px; bottom: 16px; width: 210px; z-index: 100;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04); padding: 12px 10px 16px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .toc-title { font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: .08em; padding: 2px 8px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .toc a { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    padding: 6px 8px; border-radius: 8px; color: #374151; text-decoration: none;
    font-size: 12.5px; line-height: 1.45; margin-bottom: 2px; }
  .toc a:hover { background: #f1f5f9; color: var(--blue); }
  .toc a.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
  .toc a .tk { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: var(--muted); margin-left: 4px; }
  .toc-toggle { display: none; position: fixed; left: 14px; top: 14px; z-index: 110;
    width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 17px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.14); align-items: center; justify-content: center; }
  @media (min-width: 1260px) { body { padding-left: 242px; } }
  @media (max-width: 1259px) {
    .toc { transform: translateX(-120%); transition: transform .22s ease; }
    .toc.open { transform: none; box-shadow: 0 10px 36px rgba(0,0,0,.22); }
    .toc-toggle { display: flex; }
  }
  @media (max-width: 760px) { .toc { width: 82vw; } }
</style>
</head>
<body>
